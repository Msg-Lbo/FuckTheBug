name: 发布 Windows 安装包

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true

      - name: 校验标签与应用版本
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"$' | Select-Object -First 1).Matches.Groups[1].Value
          if ($tagVersion -ne $packageVersion -or $tagVersion -ne $tauriVersion -or $tagVersion -ne $cargoVersion) {
            throw "标签版本 $tagVersion 与项目版本不一致：package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion"
          }

      - name: 安装前端依赖
        run: npm ci

      - name: 构建并创建 Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: FuckTheBug ${{ github.ref_name }}
          releaseBody: Windows 安装包与签名在线更新文件由 GitHub Actions 自动生成。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true

      - name: 发布稳定更新清单
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $branch = "${{ github.event.repository.default_branch }}"
          $manifestPath = Join-Path $env:RUNNER_TEMP "latest.json"
          $installerUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/FuckTheBug_${version}_x64-setup.exe"
          gh release download $tag --pattern latest.json --dir $env:RUNNER_TEMP
          $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
          $manifest.platforms.PSObject.Properties | ForEach-Object {
            $_.Value.url = $installerUrl
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8NoBOM $manifestPath
          gh release upload $tag $manifestPath --clobber
          $manifestBase64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($manifestPath))
          $currentFile = gh api "repos/${{ github.repository }}/contents/updater/latest.json?ref=$branch" | ConvertFrom-Json
          gh api --method PUT "repos/${{ github.repository }}/contents/updater/latest.json" `
            -f "message=chore: update manifest for $tag" `
            -f "content=$manifestBase64" `
            -f "branch=$branch" `
            -f "sha=$($currentFile.sha)"
